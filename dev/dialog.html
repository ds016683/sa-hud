<!doctype html><html lang="en"><head><meta charset="utf-8" /><title>Dialog (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>body{margin:0;background:#0F2334;min-height:100vh;font-family:'Instrument Sans',sans-serif}</style></head>
<body class="sa-surface-dark"><script type="module">
// Dev harness: the house dialog (?k=prompt|confirm|danger).
import '/src/sa-hud.css'
import { hudPrompt, hudConfirm } from '/src/lib/dialog.js'
const k = new URLSearchParams(location.search).get('k') || 'prompt'
if (k === 'prompt') hudPrompt({ title: 'A Step On This Gate', placeholder: 'What is to be done' })
else hudConfirm({ title: 'Take This Step Off?', message: 'Sample: draft the email to counsel', confirm: 'Take It Off', danger: k === 'danger' })
</script></body></html>
