<body><div id="root" class="sa-app"></div><script type="module">
// Dev harness: the real gate page on sample gates (?n=34). Its Workbench reads nothing here.
import { createElement as h } from 'react'
import { createRoot } from 'react-dom/client'
import '/src/sa-hud.css'
import GatePage from '/src/components/river/GatePage.jsx'
const N = Number(new URLSearchParams(location.search).get('n') || 34), cur = Number(new URLSearchParams(location.search).get('at') || 19)
const words = ['Sample Gate About A File Cabinet', 'Refine The Card', 'A Music Deploy', 'Voice Experiments', 'Web Cam On The Board', 'A Different Visual For The Protocols', 'Recording From The iPad', 'Smoke Test The Workflows For Side Missions']
const gates = Array.from({ length: N }, (_, i) => ({ id: `g${i + 1}`, n: i + 1, text: words[i % words.length], done: i + 1 < cur && i !== 20 }))
const g = gates[cur - 1]
createRoot(document.getElementById('root')).render(h(GatePage, { gate: { ...g, created_at: '2026-11-21T22:06:00Z' }, gates, root: 'dev', missionTitle: 'Sample Mission', tone: '#B4A3E8', onClose: () => {}, onPick: (x) => console.log('pick', x.n) }))
</script></body></html>
