<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><title>Mission debrief (dev)</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>body{margin:0;background:#0F2334}</style></head>
<body><div id="root"></div><script type="module">
// Dev harness: the real debrief page on sample data. Nothing is read from or written to the Ledger.
import { createElement as h } from 'react'
import { createRoot } from 'react-dom/client'
import '/src/sa-hud.css'
import MissionDebrief from '/src/components/river/MissionDebrief.jsx'
const project = { id: 'p1', name: 'Sample Demo App', description: 'A live demo the client can put in front of their board.' }
const tasks = [{ id: 't1', text: '1 · Prototype Build', status: 'done' }, { id: 't2', text: '2 · Send It To The Team', status: 'done' }, { id: 't3', text: '3 · Proposal For A Pilot', status: 'open' }]
const lister = async ({ projectId }) => ({ rows: projectId ? [{ id: 'f1', name: 'Sample-Report.pdf' }, { id: 'f2', name: 'Sample Proposal Deck' }, { id: 'f3', name: 'Palette-Options.png' }] : [] })
const drafter = async () => { await new Promise(r => setTimeout(r, 600)); return { closing_notes: 'Sample draft. The demo was built, shown and landed. The client asked for a pilot, and a proposal went out.', files: [{ id: 'f1', keep: 'file', why: 'The one they saw' }, { id: 'f2', keep: 'keep', why: 'Still live with the client' }, { id: 'f3', keep: 'drop', why: 'A working scrap' }], still_to_happen: [{ text: 'Follow up on the proposal in one week', why: 'Nobody owns it yet' }], who_should_hear: [{ who: 'Sample Colleague A', why: 'Built the scoring; has not been told it landed' }], missions: [{ title: 'Sample Client Pilot', kind: 'Main Mission', why: 'The proposal that went out, if they sign' }, { title: 'Turn The Proposal Deck Into A Skill', kind: 'Bounty', why: 'It was built twice by hand' }] } }
createRoot(document.getElementById('root')).render(h('div', { className: 'sa-surface-dark' }, h(MissionDebrief, { project, tasks, lister, drafter, onClose: () => console.log('closed'), onDone: async (x) => { window.__done = x; document.title = 'DONE' } })))
</script></body></html>
